<section id="matchmakingAccessGate"
         class="floral-card mb-5 overflow-hidden text-center hidden"
         aria-labelledby="matchmakingAccessTitle">
  <div class="gradient-love px-4 py-5 text-white">
    <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-white/20">
      <i class="bi bi-heart-fill text-2xl" aria-hidden="true"></i>
    </div>
    <h2 id="matchmakingAccessTitle" class="text-xl font-bold">Unlock Find Your Match</h2>
    <p class="mx-auto mt-2 max-w-xl text-sm text-white/90">
      Use your chosen preferences to discover eligible members, view everyone in the
      matchmaking directory, and keep all filters unlocked for {{ matchmaking_access_days }} days.
    </p>
  </div>
  <div class="p-5">
    <div class="mb-4 text-3xl font-bold text-primary">
      ${{ matchmaking_access_price_usd }} USD
      <span class="block text-xs font-medium text-text-secondary">
        one payment &middot; Find Your Match and See Everyone included
      </span>
    </div>
    <button id="unlockMatchmakingButton" type="button" class="btn btn-rose justify-center px-6">
      <i class="bi bi-unlock-fill" aria-hidden="true"></i>
      Unlock for {{ matchmaking_access_days }} Days
    </button>
    <p id="matchmakingPaymentStatus"
       class="mt-3 min-h-5 text-xs text-red-700"
       role="status" aria-live="polite"></p>
  </div>
</section>
