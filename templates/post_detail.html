<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post by {{ post.author.full_name }} - Kimbela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='assets/img/favy.png') }}" rel="icon" />
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <a href="{{ '/' if not current_user.is_authenticated else url_for('user.user_dashboard') }}"
               class="text-sm font-medium text-blue-600 hover:text-blue-700">
                Back to Kimbela
            </a>
            <a href="{{ url_for('user.view_profile', user_identifier=post.author.public_id) if current_user.is_authenticated else url_for('auth.login') }}"
               class="text-sm font-medium text-gray-600 hover:text-gray-800">
                View {{ post.author.first_name }}'s profile
            </a>
        </div>

        {% include "_post_card.html" %}
    </div>
</body>
</html>
