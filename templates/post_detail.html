<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ share_meta.title }}</title>
    <meta name="description" content="{{ share_meta.description }}">
    <link rel="canonical" href="{{ share_meta.url }}">
    <meta property="og:site_name" content="Kimbela">
    <meta property="og:title" content="{{ share_meta.title }}">
    <meta property="og:description" content="{{ share_meta.description }}">
    <meta property="og:image" content="{{ share_meta.image }}">
    <meta property="og:image:secure_url" content="{{ share_meta.image }}">
    <meta property="og:image:type" content="{{ share_meta.image_type }}">
    <meta property="og:image:width" content="{{ share_meta.image_width }}">
    <meta property="og:image:height" content="{{ share_meta.image_height }}">
    <meta property="og:image:alt" content="{{ share_meta.title }}">
    <meta property="og:url" content="{{ share_meta.url }}">
    <meta property="og:type" content="article">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ share_meta.title }}">
    <meta name="twitter:description" content="{{ share_meta.description }}">
    <meta name="twitter:image" content="{{ share_meta.image }}">
    <meta name="twitter:image:alt" content="{{ share_meta.title }}">
    <meta name="twitter:url" content="{{ share_meta.url }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='assets/img/favy.png') }}" rel="icon" />
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <a href="{{ '/' if not current_user.is_authenticated else url_for('user.user_dashboard') }}"
               class="text-sm font-medium text-blue-600 hover:text-blue-700">
                Back to Kimbela
            </a>
            <a href="{{ url_for('user.view_profile', user_identifier=post.author.public_id) if current_user.is_authenticated else url_for('auth.login') }}"
               class="text-sm font-medium text-gray-600 hover:text-gray-800">
                View {{ post.author.first_name }}'s profile
            </a>
        </div>

        {% include "_post_card.html" %}
    </div>
</body>
</html>
