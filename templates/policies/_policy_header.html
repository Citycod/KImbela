<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title }} - Kimbela</title>
  <link href="{{ url_for('static', filename='assets/img/favy.png') }}" rel="icon" />
  <link href="{{ url_for('static', filename='assets/img/favy.png') }}" rel="apple-touch-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Manrope', sans-serif; }
    .policy-section h2 { scroll-margin-top: 120px; }
  </style>
  <link href="{{ url_for('static', filename='assets/vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='assets/vendor/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='assets/vendor/aos/aos.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='assets/vendor/swiper/swiper-bundle.min.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='assets/vendor/glightbox/css/glightbox.min.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='assets/css/main.css') }}" rel="stylesheet" />
</head>
<body class="bg-white text-slate-800">
  <div class="relative overflow-hidden">
    <div class="relative">
      <header id="header" class="header d-flex align-items-center sticky-top" style="background-color: white;">
        <div class="header-container container-fluid container-xl position-relative d-flex align-items-center justify-content-end" style="background-color: white;">
          <a href="{{ url_for('user.index') }}" class="logo d-flex align-items-center me-auto" style="background: none">
            <img src="{{ url_for('static', filename='assets/img/kim.png') }}" alt="" style="width: 10rem; height: 5rem" />
          </a>

          <nav id="navmenu" class="navmenu" style="background-color: white;">
            <ul>
              <li><a href="{{ url_for('user.index') }}">Home</a></li>
              <li><a href="{{ url_for('user.about') }}">About Us</a></li>
              <li><a href="{{ url_for('user.features') }}">Features</a></li>
              <li><a href="{{ url_for('auth.login') }}">Login</a></li>
            </ul>
            <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
          </nav>
        </div>
      </header>

      <main class="bg-white text-slate-900">
        <div class="mx-auto max-w-6xl px-6 pb-20 pt-10 text-sm sm:text-base">
          <section class="rounded-3xl border border-slate-200 bg-white p-6 sm:p-10 shadow-sm">
            <div class="inline-flex items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-4 py-1 text-xs uppercase tracking-[0.25em] text-emerald-700">
              Last Updated {{ page_updated }}
            </div>
            <h1 class="mt-4 text-2xl font-semibold leading-tight sm:text-3xl">{{ page_title }}</h1>
            <p class="mt-3 text-sm text-slate-600">{{ page_intro }}</p>
            {% if page_meta %}
            <div class="mt-6 grid gap-4 sm:grid-cols-3">
              {% for item in page_meta %}
              <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                <p class="text-xs uppercase tracking-[0.2em] text-slate-500">{{ item.label }}</p>
                <p class="mt-2 text-sm font-semibold">{{ item.value }}</p>
              </div>
              {% endfor %}
            </div>
            {% endif %}
          </section>

          <div class="mt-10 grid gap-8 lg:grid-cols-[1fr_300px]">
            <div class="space-y-6">
