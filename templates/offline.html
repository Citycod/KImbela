{% extends 'base.html' %}

{% block head %}
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Offline - Kimbela</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center px-4 text-center">
    <div class="mb-8 text-gray-400">
        <svg class="w-32 h-32 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.163a1.996 1.996 0 012.828 0m-2.828 0l2.828 2.828m-2.828-2.828L5 3m7 12l2.828-2.828"></path>
        </svg>
    </div>
    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">You are offline</h1>
    <p class="text-gray-600 mb-8 max-w-md mx-auto text-lg">
        It looks like you've lost your internet connection. Please check your network and try again.
    </p>
    <button onclick="window.location.reload()" class="px-8 py-3 bg-purple-600 text-white rounded-xl font-medium hover:bg-purple-700 transition-colors shadow-sm">
        Try Again
    </button>
</div>
{% endblock %}
