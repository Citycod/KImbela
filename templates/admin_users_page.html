<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - Kimbela Admin</title>
    <link
      href="{{ url_for('static', filename='assets/img/favy.png') }}"
      rel="icon"
    />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 font-['Poppins'] text-slate-900">
    <script>
      window.csrfToken = "{{ csrf_token }}";
    </script>
    <div
      class="min-h-screen bg-gradient-to-br from-slate-50 via-sky-50 to-emerald-50"
    >
      <div class="flex">
        <aside
          class="hidden w-72 flex-shrink-0 border-r border-slate-200/70 bg-white/80 px-6 py-8 shadow-sm backdrop-blur lg:block"
        >
          <div class="flex items-center gap-3">
            <span
              class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-emerald-100 text-emerald-700"
            >
              <i data-lucide="shield" class="h-5 w-5"></i>
            </span>
            <div>
              <p class="text-xs uppercase tracking-[0.2em] text-slate-400">
                Admin
              </p>
              <p class="text-base font-semibold">Kimbela Console</p>
            </div>
          </div>

          <nav class="mt-10 space-y-2 text-sm">
            {% if current_user.is_super_admin %}
            <a
              href="{{ url_for('admin.admin_dashboard') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
              Overview
            </a>
            <a
              href="{{ url_for('admin.admin_ads') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="megaphone" class="h-4 w-4"></i>
              Ads
            </a>
            <a
              href="{{ url_for('admin.admin_users') }}"
              class="flex items-center gap-3 rounded-xl bg-slate-900 px-4 py-3 text-white"
            >
              <i data-lucide="users" class="h-4 w-4"></i>
              Users
            </a>
            {% endif %}
            <a
              href="{{ url_for('admin.admin_reports') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="alert-triangle" class="h-4 w-4"></i>
              Reports
            </a>
            <a
              href="{{ url_for('admin.admin_groups') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="layers" class="h-4 w-4"></i>
              Groups
            </a>
          </nav>

          <div class="mt-10 border-t border-slate-200/70 pt-6">
            <a
              href="{{ url_for('user.index') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="home" class="h-4 w-4"></i>
              Back to site
            </a>
            <a
              href="{{ url_for('user.logout') }}"
              class="mt-2 flex items-center gap-3 rounded-xl px-4 py-3 text-rose-600 hover:bg-rose-50"
            >
              <i data-lucide="log-out" class="h-4 w-4"></i>
              Logout
            </a>
          </div>
        </aside>

        <main class="flex-1 px-6 py-8 lg:px-10">
          <div class="mb-6">
            <div
              class="card rounded-2xl bg-white/80 p-6 shadow-sm backdrop-blur"
            >
              <h3 class="text-lg font-semibold text-slate-800">
                Super Admin Security
              </h3>
              <p class="text-sm text-slate-500">
                Change your password here. This is only visible to super admins.
              </p>
              <form
                method="POST"
                action="{{ url_for('admin.admin_change_password') }}"
                class="mt-4 grid gap-4 md:grid-cols-3"
              >
                <div>
                  <label class="text-sm text-slate-600">Current Password</label>
                  <input
                    type="password"
                    name="current_password"
                    required
                    class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2"
                  />
                </div>
                <div>
                  <label class="text-sm text-slate-600">New Password</label>
                  <input
                    type="password"
                    name="new_password"
                    required
                    class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2"
                  />
                </div>
                <div>
                  <label class="text-sm text-slate-600"
                    >Confirm New Password</label
                  >
                  <input
                    type="password"
                    name="confirm_password"
                    required
                    class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2"
                  />
                </div>
                <div class="md:col-span-3">
                  <button
                    type="submit"
                    class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white"
                  >
                    Update Password
                  </button>
                </div>
              </form>
            </div>
          </div>

          {% include 'admin_users.html' %}
        </main>
      </div>
    </div>

    <script>
      if (window.lucide) {
        window.lucide.createIcons();
      }
    </script>
  </body>
</html>
