<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - Kimbela Admin</title>
    <link
      href="{{ url_for('static', filename='assets/img/favy.png') }}"
      rel="icon"
    />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="admin-page bg-slate-50 font-['Poppins'] text-slate-900">
    <script>
      window.csrfToken = "{{ csrf_token }}";
    </script>
    <style>
      body.admin-page {
        font-size: 13px;
      }

      .admin-sidebar-overlay {
        display: none;
      }

      .admin-page .text-3xl {
        font-size: 1.7rem !important;
        line-height: 1.2 !important;
      }

      .admin-page .text-2xl {
        font-size: 1.35rem !important;
        line-height: 1.25 !important;
      }

      .admin-page .text-xl {
        font-size: 1.12rem !important;
        line-height: 1.3 !important;
      }

      .admin-page .text-lg {
        font-size: 1rem !important;
        line-height: 1.35 !important;
      }

      .admin-page .text-base {
        font-size: 0.92rem !important;
      }

      .admin-page .text-sm {
        font-size: 0.8rem !important;
      }

      .admin-page .text-xs {
        font-size: 0.7rem !important;
      }

      @media (max-width: 1023px) {
        .admin-layout {
          position: relative;
        }

        .admin-sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          z-index: 50;
          display: block;
          width: min(18rem, calc(100vw - 2.5rem));
          transform: translateX(-100%);
          transition: transform 0.2s ease;
          overflow-y: auto;
        }

        .admin-sidebar.is-open {
          transform: translateX(0);
        }

        .admin-sidebar-overlay {
          position: fixed;
          inset: 0;
          z-index: 40;
          background: rgba(15, 23, 42, 0.45);
          backdrop-filter: blur(2px);
        }

        .admin-sidebar-overlay.is-open {
          display: block;
        }

        .admin-mobile-header {
          display: flex;
        }
      }

      @media (min-width: 1024px) {
        .admin-mobile-header {
          display: none;
        }
      }

      .admin-layout {
        min-height: 100vh;
      }

      .admin-main {
        min-width: 0;
      }

      .admin-sidebar {
        will-change: transform;
      }

      .admin-sidebar-overlay {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .admin-sidebar-overlay.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .admin-page img {
        max-width: 100%;
      }

      .admin-page .admin-table-wrap,
      .admin-page .overflow-x-auto {
        width: 100%;
        -webkit-overflow-scrolling: touch;
      }

      @media (max-width: 768px) {
        body.admin-page {
          font-size: 10px !important;
        }

        .admin-main {
          padding: 0.75rem 0.45rem !important;
        }

        .admin-sidebar {
          width: min(15.5rem, calc(100vw - 1.25rem));
          padding: 0.9rem 0.75rem;
        }

        .admin-mobile-header {
          position: sticky;
          top: 0.5rem;
          z-index: 30;
          margin-bottom: 0.75rem;
          padding: 0.65rem 0.75rem;
        }

        .admin-page h1,
        .admin-page .text-3xl {
          font-size: 1rem !important;
          line-height: 1.2 !important;
        }

        .admin-page h2,
        .admin-page .text-2xl {
          font-size: 0.92rem !important;
        }

        .admin-page h3,
        .admin-page .text-xl {
          font-size: 0.82rem !important;
        }

        .admin-page .text-lg {
          font-size: 0.76rem !important;
        }

        .admin-page .text-base {
          font-size: 0.7rem !important;
        }

        .admin-page .text-sm {
          font-size: 0.62rem !important;
        }

        .admin-page .text-xs {
          font-size: 0.54rem !important;
        }

        .admin-page p,
        .admin-page span,
        .admin-page a,
        .admin-page th,
        .admin-page td,
        .admin-page label,
        .admin-page button,
        .admin-page input,
        .admin-page select,
        .admin-page textarea {
          font-size: 0.62rem !important;
          line-height: 1.35 !important;
        }
      }

      @media (max-width: 480px) {
        body.admin-page {
          font-size: 9px !important;
        }

        .admin-page p,
        .admin-page span,
        .admin-page a,
        .admin-page th,
        .admin-page td,
        .admin-page label,
        .admin-page button,
        .admin-page input,
        .admin-page select,
        .admin-page textarea {
          font-size: 0.56rem !important;
        }

        .admin-page .text-xs {
          font-size: 0.48rem !important;
        }
      }
    </style>
    <div
      class="min-h-screen bg-gradient-to-br from-slate-50 via-sky-50 to-emerald-50"
    >
      <div class="admin-layout flex">
        <aside
          id="adminSidebar"
          class="admin-sidebar w-72 flex-shrink-0 border-r border-slate-200/70 bg-white/80 px-6 py-8 shadow-sm backdrop-blur"
        >
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <span
                class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-emerald-100 text-emerald-700"
              >
                <i data-lucide="shield" class="h-5 w-5"></i>
              </span>
              <div>
                <p class="text-xs uppercase tracking-[0.2em] text-slate-400">
                  Admin
                </p>
                <p class="text-base font-semibold">Kimbela Console</p>
              </div>
            </div>
            <button
              type="button"
              class="rounded-xl p-2 text-slate-500 hover:bg-slate-100 lg:hidden"
              onclick="toggleAdminSidebar(false)"
              aria-label="Close admin menu"
            >
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>

          <nav class="mt-10 space-y-2 text-sm">
            {% if current_user.is_super_admin %}
            <a
              href="{{ url_for('admin.admin_dashboard') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
              Overview
            </a>
            <a
              href="{{ url_for('admin.admin_ads') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="megaphone" class="h-4 w-4"></i>
              Ads
            </a>
            <a
              href="{{ url_for('admin.admin_users') }}"
              class="flex items-center gap-3 rounded-xl bg-slate-900 px-4 py-3 text-white"
            >
              <i data-lucide="users" class="h-4 w-4"></i>
              Users
            </a>
            {% endif %}
            <a
              href="{{ url_for('admin.admin_reports') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="alert-triangle" class="h-4 w-4"></i>
              Reports
            </a>
            <a
              href="{{ url_for('admin.admin_groups') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="layers" class="h-4 w-4"></i>
              Groups
            </a>
          </nav>

          <div class="mt-10 border-t border-slate-200/70 pt-6">
            <a
              href="{{ url_for('user.index') }}"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-100"
            >
              <i data-lucide="home" class="h-4 w-4"></i>
              Back to site
            </a>
            <a
              href="{{ url_for('user.logout') }}"
              class="mt-2 flex items-center gap-3 rounded-xl px-4 py-3 text-rose-600 hover:bg-rose-50"
            >
              <i data-lucide="log-out" class="h-4 w-4"></i>
              Logout
            </a>
          </div>
        </aside>
        <button
          id="adminSidebarOverlay"
          type="button"
          class="admin-sidebar-overlay"
          onclick="toggleAdminSidebar(false)"
          aria-label="Close admin menu"
        ></button>

        <main class="admin-main flex-1 min-w-0 px-4 py-5 sm:px-6 sm:py-6 lg:px-10 lg:py-8">
          <div
            class="admin-mobile-header mb-6 items-center justify-between rounded-2xl border border-slate-200/70 bg-white/90 px-4 py-3 shadow-sm"
          >
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-slate-400">
                Admin panel
              </p>
              <p class="text-base font-semibold text-slate-900">Users</p>
            </div>
            <button
              type="button"
              class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200/70 bg-white text-slate-700"
              onclick="toggleAdminSidebar(true)"
              aria-label="Open admin menu"
            >
              <i data-lucide="menu" class="h-4 w-4"></i>
            </button>
          </div>
          <div class="mb-6">
            <div
              class="card rounded-2xl bg-white/80 p-6 shadow-sm backdrop-blur"
            >
              <h3 class="text-lg font-semibold text-slate-800">
                Super Admin Security
              </h3>
              <p class="text-sm text-slate-500">
                Change your password here. This is only visible to super admins.
              </p>
              <form
                method="POST"
                action="{{ url_for('admin.admin_change_password') }}"
                class="mt-4 grid gap-4 md:grid-cols-3"
              >
                <div>
                  <label class="text-sm text-slate-600">Current Password</label>
                  <input
                    type="password"
                    name="current_password"
                    required
                    class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2"
                  />
                </div>
                <div>
                  <label class="text-sm text-slate-600">New Password</label>
                  <input
                    type="password"
                    name="new_password"
                    required
                    class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2"
                  />
                </div>
                <div>
                  <label class="text-sm text-slate-600"
                    >Confirm New Password</label
                  >
                  <input
                    type="password"
                    name="confirm_password"
                    required
                    class="mt-1 w-full rounded-xl border border-slate-200 px-4 py-2"
                  />
                </div>
                <div class="md:col-span-3">
                  <button
                    type="submit"
                    class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white"
                  >
                    Update Password
                  </button>
                </div>
              </form>
            </div>
          </div>

          {% include 'admin_users.html' %}
        </main>
      </div>
    </div>

    <script>
      function toggleAdminSidebar(forceState) {
        const sidebar = document.getElementById("adminSidebar");
        const overlay = document.getElementById("adminSidebarOverlay");
        if (!sidebar || !overlay) {
          return;
        }

        const shouldOpen =
          typeof forceState === "boolean"
            ? forceState
            : !sidebar.classList.contains("is-open");

        if (window.innerWidth >= 1024 && shouldOpen) {
          return;
        }

        sidebar.classList.toggle("is-open", shouldOpen);
        overlay.classList.toggle("is-open", shouldOpen);
        sidebar.setAttribute("aria-hidden", shouldOpen ? "false" : "true");
        overlay.setAttribute("aria-hidden", shouldOpen ? "false" : "true");
        document.body.classList.toggle("admin-sidebar-open", shouldOpen);
        document.body.style.overflow = shouldOpen ? "hidden" : "";

        document
          .querySelectorAll('[onclick*="toggleAdminSidebar"]')
          .forEach((button) => {
            button.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
          });
      }

      window.addEventListener("resize", () => {
        if (window.innerWidth >= 1024) {
          toggleAdminSidebar(false);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          toggleAdminSidebar(false);
        }
      });

      if (window.lucide) {
        window.lucide.createIcons();
      }
    </script>
  </body>
</html>
