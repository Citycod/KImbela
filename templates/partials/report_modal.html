    <!-- Report Modal -->
    <div id="reportModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white rounded-xl md:rounded-2xl shadow-2xl w-full max-w-sm md:max-w-md mx-2 md:mx-4 modal-content">
            <div class="p-4 md:p-6 border-b border-gray-200">
                <h3 class="text-lg md:text-xl font-semibold modal-title">Report Content</h3>
            </div>

            <form id="reportForm" class="p-4 md:p-6">
                <input type="hidden" id="reportContentType">
                <input type="hidden" id="reportContentId">

                <div class="space-y-3 md:space-y-4 mb-4 md:mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Reason for reporting</label>
                        <div class="space-y-1 md:space-y-2">
                            <label class="flex items-center text-xs md:text-sm">
                                <input type="radio" name="reportReason" value="Spam" class="mr-2 md:mr-3">
                                <span>Spam</span>
                            </label>
                            <label class="flex items-center text-xs md:text-sm">
                                <input type="radio" name="reportReason" value="Harassment" class="mr-2 md:mr-3">
                                <span>Harassment or bullying</span>
                            </label>
                            <label class="flex items-center text-xs md:text-sm">
                                <input type="radio" name="reportReason" value="Hate speech" class="mr-2 md:mr-3">
                                <span>Hate speech</span>
                            </label>
                            <label class="flex items-center text-xs md:text-sm">
                                <input type="radio" name="reportReason" value="Inappropriate content" class="mr-2 md:mr-3">
                                <span>Inappropriate content</span>
                            </label>
                            <label class="flex items-center text-xs md:text-sm">
                                <input type="radio" name="reportReason" value="False information" class="mr-2 md:mr-3">
                                <span>False information</span>
                            </label>
                            <label class="flex items-center text-xs md:text-sm">
                                <input type="radio" name="reportReason" value="Other" class="mr-2 md:mr-3">
                                <span>Other</span>
                            </label>
                        </div>
                    </div>

                    <div id="otherReasonContainer" class="hidden">
                        <textarea id="otherReason" placeholder="Please provide additional details..."
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-xs md:text-sm"></textarea>
                    </div>
                </div>

                <div class="flex space-x-2 md:space-x-3">
                    <button type="button" onclick="closeReportModal()"
                            class="flex-1 bg-gray-100 text-gray-700 py-2 md:py-3 rounded-lg md:rounded-xl hover:bg-gray-200 transition-colors duration-300 font-semibold text-sm md:text-base modal-button">
                        Cancel
                    </button>
                    <button type="submit"
                            class="flex-1 bg-orange-600 text-white py-2 md:py-3 rounded-lg md:rounded-xl hover:bg-orange-700 transition-colors duration-300 font-semibold text-sm md:text-base modal-button">
                        Submit Report
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openReportModal() {
            document.getElementById('reportModal').classList.remove('hidden');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportForm').reset();
            document.getElementById('otherReasonContainer').classList.add('hidden');
        }

        function reportContent(type, id) {
            document.getElementById('reportContentType').value = type;
            document.getElementById('reportContentId').value = id;
            openReportModal();
        }

        document.querySelectorAll('input[name="reportReason"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const otherContainer = document.getElementById('otherReasonContainer');
                if (this.value === 'Other') {
                    otherContainer.classList.remove('hidden');
                } else {
                    otherContainer.classList.add('hidden');
                }
            });
        });

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const reason = document.querySelector('input[name="reportReason"]:checked')?.value;
            const info = document.getElementById('otherReason').value;

            try {
                const res = await fetch('/report_content', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        {% set _csrf_val = csrf_token() if csrf_token is callable else csrf_token %}
                        'X-CSRFToken': window.csrfToken || '{{ _csrf_val }}'
                    },
                    body: JSON.stringify({
                        content_type: document.getElementById('reportContentType').value,
                        content_id: document.getElementById('reportContentId').value,
                        reason: reason,
                        additional_info: info
                    })
                });
                const data = await res.json();
                if (data.success) {
                    if (typeof Toast !== 'undefined' && Toast.show) {
                        Toast.show('Reported successfully', 'success');
                    } else if (typeof showToast === 'function') {
                        showToast('Reported successfully', 'success');
                    } else {
                        alert('Reported successfully');
                    }
                    closeReportModal();
                } else {
                    if (typeof Toast !== 'undefined' && Toast.show) {
                        Toast.show(data.error || 'Failed', 'error');
                    } else if (typeof showToast === 'function') {
                        showToast(data.error || 'Failed', 'danger');
                    } else {
                        alert(data.error || 'Failed');
                    }
                }
            } catch (err) {
                console.error(err);
                if (typeof Toast !== 'undefined' && Toast.show) {
                    Toast.show('Network error', 'error');
                } else {
                    alert('Network error');
                }
            }
        });
    </script>
