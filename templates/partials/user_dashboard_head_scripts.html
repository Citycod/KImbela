<script>
      // Set global variables
      window.currentUserId = {{ current_user.id }};
      window.currentUserName = '{{ current_user.full_name|safe }}';
      window.currentUserAvatar = '{{ current_user.profile_pic or url_for("static", filename="assets/img/default-avatar.png") }}';
      window.defaultAvatar = '{{ url_for("static", filename="assets/img/default-avatar.png") }}';
      window.csrfToken = '{{ csrf_token }}';

      // Fallback functions in case Messenger doesn't load
      window.openMessenger = function(friendId = null) {
          const popup = document.getElementById('messengerPopup');
          if (popup) {
              popup.classList.remove('hidden');
              document.body.style.overflow = 'hidden';
          }
      };

      window.closeMessenger = function() {
          const popup = document.getElementById('messengerPopup');
          if (popup) {
              popup.classList.add('hidden');
              document.body.style.overflow = '';
          }
      };

      window.backToFriends = function() {
          document.getElementById('chatArea').classList.add('hidden');
          document.getElementById('friendList').classList.remove('hidden');
      };

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {
          console.log('DOM loaded, checking for Messenger...');

          // Check if Messenger exists
          if (typeof Messenger === 'undefined') {
              console.warn('Messenger not defined, loading script...');

              // Create a promise to wait for script load
              const loadMessenger = new Promise((resolve, reject) => {
                  const script = document.createElement('script');
                  script.src = '{{ url_for("static", filename="assets/js/messenger.js") }}';
                  script.onload = () => {
                      console.log('✅ messenger.js loaded');
                      resolve();
                  };
                  script.onerror = () => {
                      console.error('❌ Failed to load messenger.js');
                      reject();
                  };
                  document.head.appendChild(script);
              });

              // Initialize after script loads
              loadMessenger.then(() => {
                  setTimeout(() => {
                      if (typeof Messenger !== 'undefined' && Messenger.init) {
                          Messenger.init();
                          console.log('✅ Messenger initialized successfully');
                      } else {
                          console.error('❌ Messenger still not defined after loading');
                      }
                  }, 500);
              }).catch(() => {
                  console.error('❌ Failed to initialize Messenger');
              });
          } else {
              // Messenger already exists (inline)
              setTimeout(() => {
                  if (Messenger.init) {
                      Messenger.init();
                      console.log('✅ Messenger initialized from existing');
                  }
              }, 500);
          }
      });
    </script>

<script>
      // ========================================
      // BASIC MESSENGER FUNCTIONS - MUST BE DEFINED EARLY
      // ========================================

      // Define these functions BEFORE any inline onclick handlers try to use them
      window.openMessenger = function (friendId = null) {
        console.log("Opening messenger, friendId:", friendId);

        const messengerPopup = document.getElementById("messengerPopup");
        if (!messengerPopup) {
          console.error("Messenger popup not found");
          return;
        }

        // Show messenger popup
        messengerPopup.classList.remove("hidden");

        // If a specific friend is provided, open chat with them
        if (friendId) {
          console.log("Opening chat with user:", friendId);

          // Try to show chat area if possible
          const chatArea = document.getElementById("chatArea");
          const friendList = document.getElementById("friendList");
          if (chatArea && friendList) {
            friendList.classList.add("hidden");
            chatArea.classList.remove("hidden");

            // Set basic chat info
            document.getElementById("chatName").textContent = "Loading...";
          }
        } else {
          // Just show friends list
          console.log("Opening messenger to friends list");
          document.getElementById("friendList").classList.remove("hidden");
          document.getElementById("chatArea").classList.add("hidden");
        }

        // Prevent body scrolling when messenger is open
        document.body.style.overflow = "hidden";
      };

      window.closeMessenger = function () {
        console.log("Closing messenger");
        const messengerPopup = document.getElementById("messengerPopup");
        if (messengerPopup) {
          messengerPopup.classList.add("hidden");
        }
        // Restore body scrolling
        document.body.style.overflow = "";
      };

      window.backToFriends = function () {
        document.getElementById("chatArea").classList.add("hidden");
        document.getElementById("friendList").classList.remove("hidden");
      };

      // Basic send message function
      window.sendMessage = function () {
        const input = document.getElementById("chatInput");
        const messagesContainer = document.getElementById("chatMessages");

        if (!input || !messagesContainer) return;

        const content = input.value.trim();
        if (content === "") return;

        // Create message element
        const messageDiv = document.createElement("div");
        messageDiv.className = "message-container mb-4 sent";

        const time = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        messageDiv.innerHTML = `
        <div class="message-bubble sent max-w-xs lg:max-w-md">
            <div class="message-content break-words whitespace-pre-wrap">${content}</div>
            <div class="flex items-center justify-between mt-1">
                <span class="text-xs opacity-70">${time}</span>
                <span class="text-xs opacity-70 ml-2"><i class="bi bi-check text-xs"></i></span>
            </div>
        </div>
    `;

        // Add message to container
        if (
          messagesContainer.children.length === 1 &&
          messagesContainer.children[0].classList.contains("text-center")
        ) {
          messagesContainer.innerHTML = "";
        }

        messagesContainer.appendChild(messageDiv);

        // Clear input
        input.value = "";
        input.style.height = "auto";

        // Scroll to bottom
        const wrapper = document.getElementById("chatMessagesWrapper");
        if (wrapper) {
          wrapper.scrollTop = wrapper.scrollHeight;
        }
      };

      // Auto-resize textarea
      window.autoResizeTextarea = function (textarea) {
        textarea.style.height = "auto";
        const newHeight = Math.min(textarea.scrollHeight, 120);
        textarea.style.height = newHeight + "px";
      };

      // Basic typing handler
      window.handleTyping = function () {
        console.log("User is typing...");
        // Placeholder - would use socket.io in full version
      };

      // Handle chat input keypress
      window.handleChatInputKeypress = function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          window.sendMessage();
        }
      };
    </script>
