version: '3.8'
services:
  web:
    image: kimbela
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kimbela-container
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_APP=runserver.py
      - FLASK_ENV=production
      - SQLALCHEMY_TRACK_MODIFICATIONS=false
    volumes:
      - .:/app
    command: gunicorn --timeout 60 --workers 2 --bind 0.0.0.0:5000 runserver:app
    restart: always
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
