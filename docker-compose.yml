version: '3.8'

services:
  web:
    image: kimbela
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kimbela-container
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      FLASK_APP: runserver.py
      FLASK_ENV: production
      SQLALCHEMY_TRACK_MODIFICATIONS: "false"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    command: gunicorn --config gunicorn.conf.py --bind 0.0.0.0:5000 runserver:app
    restart: always
    networks:
      - app-network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
