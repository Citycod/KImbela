version: '3.8'

services:
  web:
    image: kimbela
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kimbela-container
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_APP: runserver.py
      FLASK_ENV: production
      SQLALCHEMY_TRACK_MODIFICATIONS: "false"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - .:/app
    # Updated command for gevent WebSocket support
    command: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 2 --bind 0.0.0.0:5000 runserver:app
    restart: always
    networks:
      - app-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge