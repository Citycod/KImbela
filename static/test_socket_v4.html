<!DOCTYPE html>
<html>

<head>
    <title>Socket.IO v4 Test</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        .log {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .success {
            color: green;
        }
        
        .error {
            color: red;
        }
        
        .info {
            color: blue;
        }
    </style>
</head>

<body>
    <h1>Socket.IO v4 Compatibility Test</h1>

    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="ping()">Ping</button>
    </div>

    <div id="log" class="log"></div>

    <script>
        let socket = null;
        const logElement = document.getElementById('log');

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${time}] ${message}`;
            logElement.appendChild(div);
            logElement.scrollTop = logElement.scrollHeight;
        }

        function connect() {
            if (socket) {
                log('Already connected', 'info');
                return;
            }

            log('Connecting to Socket.IO server...', 'info');

            // Connect with explicit v4 configuration
            socket = io('http://localhost:5000', {
                transports: ['websocket', 'polling'],
                upgrade: true,
                forceNew: false,
                reconnection: true,
                reconnectionAttempts: 5,
                reconnectionDelay: 1000,
                timeout: 20000,
                // v4 specific options
                withCredentials: false,
                extraHeaders: {}
            });

            socket.on('connect', () => {
                log('✅ Connected successfully!', 'success');
                log(`Socket ID: ${socket.id}`, 'info');
            });

            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`, 'error');
                console.error('Connection error details:', error);
            });

            socket.on('disconnect', (reason) => {
                log(`⚠️ Disconnected: ${reason}`, 'info');
            });

            socket.on('connected', (data) => {
                log(`✅ Server handshake: ${JSON.stringify(data)}`, 'success');
            });

            socket.on('pong', (data) => {
                log(`🏓 Pong received: ${JSON.stringify(data)}`, 'info');
            });

            socket.on('message_response', (data) => {
                log(`📨 Message response: ${JSON.stringify(data)}`, 'info');
            });

            socket.on('error', (data) => {
                log(`❌ Socket error: ${JSON.stringify(data)}`, 'error');
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                log('Disconnected manually', 'info');
            }
        }

        function ping() {
            if (socket && socket.connected) {
                log('Sending ping...', 'info');
                socket.emit('ping');

                // Also test a message
                socket.emit('message', {
                    text: 'Hello from client',
                    timestamp: new Date().toISOString()
                });
            } else {
                log('Not connected', 'error');
            }
        }

        // Auto-connect
        window.addEventListener('load', () => {
            setTimeout(connect, 1000);
        });
    </script>
</body>

</html>
